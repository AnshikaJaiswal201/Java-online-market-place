server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: online-marketplace-backend

  datasource:
    # Oracle 21c XE default pluggable database service name is XEPDB1
    # If using classic non-CDB SID, change to: jdbc:oracle:thin:@localhost:1521:XE
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:system}
    password: ${DB_PASSWORD:oracle}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

# Custom Application & JWT Properties
app:
  jwt:
    # 256-bit secret key for HMAC-SHA256 signing
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours (in milliseconds)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
