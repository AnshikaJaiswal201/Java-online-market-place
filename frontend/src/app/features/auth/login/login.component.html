<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="auth-header">
      <i class="fa-solid fa-lock auth-icon"></i>
      <h2>Sign In to ShopVerse</h2>
      <p class="auth-subtitle">Access your orders, wishlist, or seller dashboard</p>
    </div>

    <!-- Registration Success Alert -->
    <div class="alert alert-success" *ngIf="registeredSuccess" style="background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; font-size: 14px;">
      <i class="fa-solid fa-circle-check" style="color: #198754; font-size: 18px;"></i>
      <div>
        <strong>Account Registered &amp; Saved in Database!</strong><br />
        Enter your password below to sign in.
      </div>
    </div>

    <!-- Error Alert -->
    <div class="alert alert-danger" *ngIf="errorMessage">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          class="form-control" 
          placeholder="name@example.com"
        />
        <div class="form-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          class="form-control" 
          placeholder="••••••••"
        />
        <div class="form-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required.
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid || loading">
        <i class="fa-solid fa-arrow-right-to-bracket" *ngIf="!loading"></i>
        <i class="fa-solid fa-spinner fa-spin" *ngIf="loading"></i>
        {{ loading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>

    <!-- Quick Demo Accounts -->
    <div class="demo-accounts">
      <p class="demo-title">Quick Demo Login:</p>
      <div class="demo-buttons">
        <button type="button" class="btn btn-outline btn-sm" (click)="fillCredentials('seller.sharma@marketplace.in')">
          <i class="fa-solid fa-store"></i> Seller Demo
        </button>
        <button type="button" class="btn btn-outline btn-sm" (click)="fillCredentials('aarav.patel@gmail.com')">
          <i class="fa-solid fa-user"></i> Customer Demo
        </button>
      </div>
    </div>

    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a routerLink="/auth/register">Create Account</a>
    </div>
  </div>
</div>
