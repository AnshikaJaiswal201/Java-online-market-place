<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="500" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">SYSTEM CONTEXT DIAGRAM (DFD LEVEL 0)</text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#64748b">ShopVerse — Online Market Place Web Application</text>

  <!-- ========================================================================= -->
  <!-- 1. GUEST VISITOR ENTITY (Top-Left) -->
  <!-- ========================================================================= -->
  <g filter="url(#shadow)">
    <rect x="50" y="120" width="220" height="95" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5" />
    <rect x="50" y="120" width="220" height="30" rx="10" fill="#0284c7" />
    <rect x="50" y="135" width="220" height="15" fill="#0284c7" />
    <text x="160" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">EXTERNAL ENTITY</text>
    <text x="160" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#0369a1">GUEST VISITOR</text>
    <text x="160" y="196" text-anchor="middle" font-size="12" fill="#64748b">(Unregistered Shopper)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. CUSTOMER ENTITY (Bottom-Left) -->
  <!-- ========================================================================= -->
  <g filter="url(#shadow)">
    <rect x="50" y="440" width="220" height="95" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5" />
    <rect x="50" y="440" width="220" height="30" rx="10" fill="#059669" />
    <rect x="50" y="455" width="220" height="15" fill="#059669" />
    <text x="160" y="461" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">EXTERNAL ENTITY</text>
    <text x="160" y="494" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">CUSTOMER</text>
    <text x="160" y="516" text-anchor="middle" font-size="12" fill="#64748b">(Registered Buyer)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. SELLER ENTITY (Right) -->
  <!-- ========================================================================= -->
  <g filter="url(#shadow)">
    <rect x="730" y="270" width="220" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" />
    <rect x="730" y="270" width="220" height="30" rx="10" fill="#d97706" />
    <rect x="730" y="285" width="220" height="15" fill="#d97706" />
    <text x="840" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">EXTERNAL ENTITY</text>
    <text x="840" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">SELLER / MERCHANT</text>
    <text x="840" y="348" text-anchor="middle" font-size="12" fill="#64748b">(Catalog &amp; Stock Owner)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. CENTRAL PROCESS 0.0 (System Boundary) -->
  <!-- ========================================================================= -->
  <g filter="url(#shadow)">
    <circle cx="500" cy="325" r="125" fill="#eef2ff" stroke="#4f46e5" stroke-width="3" />
    <circle cx="500" cy="325" r="117" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" />
    <text x="500" y="275" text-anchor="middle" font-size="15" font-weight="800" fill="#4338ca">PROCESS 0.0</text>
    <line x1="420" y1="288" x2="580" y2="288" stroke="#4f46e5" stroke-width="1.5" />
    <text x="500" y="318" text-anchor="middle" font-size="18" font-weight="800" fill="#1e1b4b">ONLINE MARKET</text>
    <text x="500" y="342" text-anchor="middle" font-size="18" font-weight="800" fill="#1e1b4b">PLACE SYSTEM</text>
    <text x="500" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">(ShopVerse)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 5. FLOWS: GUEST VISITOR <-> SYSTEM -->
  <!-- ========================================================================= -->
  <!-- Guest -> System -->
  <path d="M 270 145 C 360 145, 395 210, 420 240" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="250" y="112" width="170" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="335" y="129" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Search Queries &amp; Reg. Info</text>

  <!-- System -> Guest -->
  <path d="M 405 260 C 375 225, 340 185, 270 185" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="250" y="193" width="170" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="335" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Product Catalog &amp; Reg. Status</text>

  <!-- ========================================================================= -->
  <!-- 6. FLOWS: CUSTOMER <-> SYSTEM -->
  <!-- ========================================================================= -->
  <!-- Customer -> System -->
  <path d="M 270 465 C 345 465, 380 435, 410 395" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="230" y="415" width="185" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="322" y="431" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">1. Login Credentials</text>
  <text x="322" y="447" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">2. Cart &amp; Mock Checkout (UPI)</text>

  <!-- System -> Customer -->
  <path d="M 425 415 C 395 455, 355 505, 270 505" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="230" y="515" width="185" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="322" y="531" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">1. JWT Token &amp; Live Cart</text>
  <text x="322" y="547" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">2. Order Receipt &amp; Live Status</text>

  <!-- ========================================================================= -->
  <!-- 7. FLOWS: SELLER <-> SYSTEM -->
  <!-- ========================================================================= -->
  <!-- Seller -> System -->
  <path d="M 730 305 L 628 305" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="632" y="245" width="195" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="730" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">• Seller Credentials</text>
  <text x="730" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">• Product CRUD &amp; Pricing (₹)</text>
  <text x="730" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">• Inventory Restock &amp; Threshold</text>

  <!-- System -> Seller -->
  <path d="M 628 345 L 730 345" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="632" y="355" width="195" height="52" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="730" y="372" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">• JWT Token &amp; Sales Orders</text>
  <text x="730" y="387" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">• Dashboard Metrics (Revenue ₹)</text>
  <text x="730" y="402" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">• Low-Stock Warning Alerts</text>

  <!-- Footer Boundary Note -->
  <rect x="310" y="625" width="380" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="500" y="643" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">System Boundary: Process 0.0 with 3 External Entities</text>
</svg>
